name: Update theme

on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-update:
    runs-on: ubuntu-latest
    outputs:
      theme-changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Update theme
        run: hugo mod get -u github.com/CaiJimmy/hugo-theme-stack/v3

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      - name: Verify Stack template mounts
        run: |
          hugo config mounts | grep -Fq '"target": "layouts/life-blog/list.html"'
          hugo config mounts | grep -Fq '"target": "layouts/partials/upstream-stack/sidebar-left.html"'

      - name: Build
        run: hugo --minify --gc

      - name: Generate and validate route aliases
        run: ./scripts/generate-route-aliases.sh public

      - name: Detect module changes
        id: changes
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated module files
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: theme-module-update
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 1

  open-pull-request:
    if: needs.prepare-update.outputs.theme-changed == 'true'
    needs: prepare-update
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download validated module files
        uses: actions/download-artifact@v4
        with:
          name: theme-module-update
          path: .theme-module-update

      - name: Apply validated module files
        run: cp .theme-module-update/go.mod .theme-module-update/go.sum .

      - name: Create theme update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            go.mod
            go.sum
          base: master
          branch: automation/update-stack-theme
          delete-branch: true
          commit-message: "chore: update Stack theme"
          title: "chore: update Stack theme"
          body: |
            Automated Stack theme update.

            The updated module files were validated with a full Hugo build and
            route-alias generation before this pull request was created.
