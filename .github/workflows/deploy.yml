name: Deploy to Github Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
              with:
                  hugo-version: "0.152.2"
                  extended: true

            - name: Verify Stack template mounts
              run: |
                  hugo config mounts | grep -Fq '"target": "layouts/life-blog/list.html"'
                  hugo config mounts | grep -Fq '"target": "layouts/partials/upstream-stack/sidebar-left.html"'

            - name: Test academic post scaffolding
              run: ./scripts/test-new-academic-post.sh

            - name: Build
              run: hugo --minify --gc

            - name: Generate route aliases
              run: ./scripts/generate-route-aliases.sh public

            - name: Upload generated site
              if: github.event_name == 'push'
              uses: actions/upload-artifact@v4
              with:
                  name: generated-site
                  path: public
                  if-no-files-found: error
                  retention-days: 1

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: build
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Download generated site
              uses: actions/download-artifact@v4
              with:
                  name: generated-site
                  path: public

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
